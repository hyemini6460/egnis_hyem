<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제로소다 누액 이슈 대시보드</title>
<style>
  :root{
    --navy:#12213f; --navy-2:#1b2d52; --bg:#f3f5f9; --card:#ffffff; --line:#e5e9f0;
    --text:#1b2233; --sub:#707a8c; --accent:#2f5fe0;
    --up:#e0473a; --down:#1f9d6b; --flat:#9aa2b1;
    --warn-bg:#fff3ea; --warn:#c25b1e;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',-apple-system,sans-serif;background:var(--bg);color:var(--text);}
  .app{display:flex;min-height:100vh;}
  .sidebar{width:220px;flex-shrink:0;background:linear-gradient(180deg,var(--navy),var(--navy-2));color:#fff;padding:24px 18px;display:flex;flex-direction:column;gap:20px;}
  .brand{font-size:15px;font-weight:700;letter-spacing:.2px;opacity:.95;}
  .brand small{display:block;font-weight:400;opacity:.6;font-size:11px;margin-top:4px;}
  .side-section{margin-top:8px;}
  .side-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.5;margin-bottom:10px;}
  .side-stat{background:rgba(255,255,255,.06);border-radius:10px;padding:12px 14px;margin-bottom:10px;}
  .side-stat .n{font-size:20px;font-weight:700;}
  .side-stat .l{font-size:11.5px;opacity:.65;margin-top:2px;}
  .main{flex:1;padding:26px 32px 60px;min-width:0;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;margin-bottom:22px;}
  h1{font-size:21px;margin:0 0 4px;font-weight:800;}
  .subtitle{font-size:12.5px;color:var(--sub);}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .seg{display:flex;background:#e9ecf3;border-radius:9px;padding:3px;gap:2px;}
  .seg button{border:none;background:transparent;padding:7px 14px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--sub);cursor:pointer;}
  .seg button.active{background:var(--navy);color:#fff;}
  select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:600;color:var(--text);cursor:pointer;}
  select:disabled{opacity:.4;cursor:not-allowed;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px;}
  .summary-card{background:linear-gradient(180deg,#f8faff,#ffffff);border-color:#dbe4fb;}
  .card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .card-title{font-size:14px;font-weight:800;}
  .card-note{font-size:11px;color:var(--sub);}
  .notice{background:var(--warn-bg);color:var(--warn);font-size:11.5px;padding:8px 12px;border-radius:8px;margin-top:10px;}
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px;}
  .kpi-grid-top{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:14px;}
  .kpi-grid-bottom{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px;}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;}
  .kpi .l{font-size:12px;color:var(--sub);font-weight:700;margin-bottom:10px;}
  .kpi .v{font-size:24px;font-weight:800;}
  .kpi .v .cnt{font-size:15px;font-weight:700;color:var(--sub);margin-left:6px;}
  .kpi .d{font-size:11.5px;margin-top:0;font-weight:700;line-height:1.6;}
  .delta-toggle{background:none;border:none;padding:0;margin-top:10px;font-size:11.5px;color:var(--accent);cursor:pointer;font-weight:600;display:flex;align-items:center;gap:4px;}
  .delta-toggle:hover{text-decoration:underline;}
  .delta-toggle .chev{font-size:9px;transition:transform .15s;display:inline-block;}
  .delta-toggle.open .chev{transform:rotate(180deg);}
  .delta-content{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);}
  .d.up{color:var(--up);} .d.down{color:var(--down);} .d.flat{color:var(--flat);}
  .kpi.res-재출고,.kpi.res-환불,.kpi.res-클레임,.kpi.res-total{border-top:1px solid var(--line);}
  .footer-note{font-size:11px;color:var(--sub);text-align:center;margin-top:20px;}
  @media (max-width:1000px){ .kpi-grid{grid-template-columns:repeat(2,1fr);} .kpi-grid-top{grid-template-columns:1fr;} .kpi-grid-bottom{grid-template-columns:1fr;} .sidebar{display:none;} }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="brand">클룹 · 제로소다<small>누액 이슈 트래킹</small></div>
    <div class="side-section">
      <div class="side-label">전체 요약 (7/1~8/14)</div>
      <div class="side-stat"><div class="n" id="side-total">-</div><div class="l">총 인입 건수</div></div>
      <div class="side-stat"><div class="n" id="side-cost">-</div><div class="l">총 처리 비용(원)</div></div>
      <div class="side-stat"><div class="n" id="side-days">-</div><div class="l">데이터 발생일수</div></div>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div>
        <h1>제로소다 누액 이슈 대시보드</h1>
      </div>
      <div class="controls">
        <div class="seg" id="periodSeg">
          <button data-p="day" class="active">일별</button>
          <button data-p="week">주별</button>
          <button data-p="month">월별</button>
          <button data-p="all">전체</button>
        </div>
        <select id="periodSelect"></select>
      </div>
    </div>

    <div class="card summary-card">
      <div class="card-head"><div class="card-title">📌 선택 기간 요약</div></div>
      <div id="summaryBox" style="font-size:13.5px;line-height:1.9;color:#2a3348;margin-top:6px;display:flex;flex-direction:column;gap:5px;"></div>
    </div>

    <div class="kpi-grid-top" id="kpiGridTop"></div>
    <div class="kpi-grid-bottom" id="kpiGridBottom"></div>

    <div class="footer-note">데이터 출처: <a href="https://docs.google.com/spreadsheets/d/19itZBAUygIEWvMJZiSfg8x-rXBwYzY__37m4nkJ-jvQ/edit?gid=1972981996#gid=1972981996" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:underline;">제로소다 시트</a></div>
  </div>
</div>

고 하셨지만, 이는 판매자와 배송업체 사이에서 확인하고 처리하실 문제라고 생각합니다. 소비자는 정상적인 상태의 상품을 배송받아야 하며, 배송 과정에서 파손된 제품으로 인해 추가 피해까지 발생한 상황에서 상품 환불만으로 처리가 끝나는 것은 납득하기 어렵습니다.\n\n장과 비품의 피해 사진 및 영상을 제출할 수 있으니, 해당 피해에 대한 보상 접수가 가능한지 확인 부탁드립니다. 상담원 선에서 안내가 어려우시다면 관련 보상 담당 부서나 책임자에게 내용을 전달해 주시고, 피해 보상 절차와 필요한 서류를 구체적으로 안내해 주세요.\n\n다시 말씀드리지만 현재 요청드리는 것은 남은 제품의 전액 환불이 아니라, 제품 누수로 인해 발생한 2차 피해에 대한 확인과 보상입니다. 현재도 추가 누수가 발생하고 있어 2차 피해 방지를 위해, 누수 제품의 전체 수량과 소비기한, 캔 하단 상태 및 누수 모습을 사진과 영상으로 남긴 후 보유 상품은 모두 폐기하도록 하겠습니다. 업체 측 안내에 따라 전체 폐기하는 것이므로, 추후 렉 선반의 2차 피해 보상 검토 과정에서 실물 제품을 보관하지 않았다는 이유로 불이익이 없도록 해당 내용도 함께 기록 부탁드립니다. 주문 건 전액 환불은 기존 결제수단으로 자동 처리되는 것인지, 별도로 계좌정보를 전달드려야 하는지도 안내 부탁드립니다. 렉 피해 보상과 관련해서는 현재 전달드린 사진 외에 추가로 필요한 사진이나 자료가 있다면 말씀해 주세요. 유관부서 확인 후 구체적인 처리 방안과 절차 안내 부탁드립니다.\n\n제로소다맛 소비기한: 2028년 5월 8일\n포도맛 소비기한: 2028년 2월 4일\n> 100000원/ 애사비소다,매실제로,500 6개 / 샤인머스캣제로,500 6개 / 자두제로,500ml 6개/ 제주감귤제로,500 6개","tags":[]},{"date":"2026-08-05","resolution":"재출고","cost":5115,"detailed":true,"message":"누액으로 내용물 없음\n> 동일상품 1개 재출고","tags":[]},{"date":"2026-08-05","resolution":"환불","cost":19900,"detailed":true,"message":"누액 2차문의","tags":[]},{"date":"2026-08-06","resolution":"클레임","cost":0,"detailed":true,"message":"클룹 제로소다 주문했는데 3개가 터져서 보관하고 있던 장이 다 들떴어요 환불이 문제가 아니라 장을 새로 짜야한다구요 연락 빨리 주세요 아니 환불이나 새상품 배송 필요없고\n보관했던 수납장이 클룹제품때문에 망가졌다구요 혹시나 해서 말씀드리는데 이번에 신축 입주라서 수납장에 클룹제품말고 다른 거 보관하지도 않았고 반려동물 키우지도 않아서 수납장에 대소변 묻을 일도 없고 클룹 제품 때문에 수납장 자체가 망가졌으니까 원상복구 해주시라구요 오셔서 직접 수거해가시고 장 상태 보고 원상복구해주세요\n제가 유통과정까지 신경써야하나요? 유통실수인지 제조상 실수인지 어떻게 아나요\n집에서 제품 보관할때도 더운 환경이 아니라 에어컨 틀어놓은 실내에 상시 보관했고\n클룹 밖에 보관을 안했었고 입주 사전점검때도 멀쩡한 수납장이었어요\n클룹 외에는 수납장 파손될 사유가 하나도 없어요\n검토 하고 연락주세요","tags":[]},{"date":"2026-08-06","resolution":"환불","cost":19900,"detailed":true,"message":"보관 중 누액 > 소다 결제 금액 19900원 카드결제 전체 환불 및 잔여 상품 폐기 요청 완료","tags":[]},{"date":"2026-08-06","resolution":"환불","cost":19900,"detailed":true,"message":"안녕하세요, 6/4 행사 할때 와이프랑 저랑 각각 계정으로 음료수를 많이 구매했습니다. (임지혜,홍종범)\n\n최근 베란다에서 제로소다를 먹으려 꺼내는데, 6개묶음중 한캔이 텅텅 비어있고, 주변에 있던 쌀포대가 다 젖어있더라고요.. 캔이 오픈이 안되어있는 function fmtNum(n){ return n.toLocaleString('ko-KR'); }
function fmtWon(n){ return n.toLocaleString('ko-KR') + '원'; }

function isoWeek(d){
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = (date.getUTCDay() + 6) % 7;
  date.setUTCDate(date.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(date.getUTCFullYear(),0,4));
  const week = 1 + Math.round(((date - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay()+6)%7)) / 7);
  return {year: date.getUTCFullYear(), week};
}
function weekRangeLabel(year, week){
  const simple = new Date(Date.UTC(year, 0, 1 + (week-1)*7));
  const dow = simple.getUTCDay();
  const monday = new Date(simple);
  const diff = (dow<=4) ? (1-dow) : (8-dow);
  monday.setUTCDate(simple.getUTCDate()+diff);
  const sunday = new Date(monday); sunday.setUTCDate(monday.getUTCDate()+6);
  const f = d => `${d.getUTCMonth()+1}/${d.getUTCDate()}`;
  return `${week}주차 (${f(monday)}~${f(sunday)})`;
}

  r._monthKey = r.date.slice(0,7);
  r._monthLabel = r.date.slice(0,4)+'년 '+parseInt(r.date.slice(5,7))+'월';
  r._dayLabel = `${d.getMonth()+1}/${d.getDate()} (${['일','월','화','수','목','금','토'][d.getDay()]})`;
});

function periodKeyForDate(dateStr, period){
  if(period==='all') return 'ALL';
  const d = new Date(dateStr+'T00:00:00');
  if(period==='day') return dateStr;
  if(period==='week'){ const iw = isoWeek(d); return iw.year+'-W'+String(iw.week).padStart(2,'0'); }
  return dateStr.slice(0,7);
}
function logCountsByPeriod(period){
  const map = new Map();
  LOG_DATES.forEach(ds=>{
    const k = periodKeyForDate(ds, period);
    map.set(k, (map.get(k)||0)+1);
  });
  return map;
}

function groupBy(period){
  if(period==='all'){
    const dts = RECORDS.map(r=>r.date).sort();
    const f = ds => `${parseInt(ds.slice(5,7))}/${parseInt(ds.slice(8,10))}`;
    return [{key:'ALL', label:`전체 기간 (${f(dts[0])}~${f(dts[dts.length-1])})`, items: RECORDS.slice()}];
  }
  const keyFn = period==='day' ? r=>r.date : period==='week' ? r=>r._weekKey : r=>r._monthKey;
  const labelFn = period==='day' ? r=>r._dayLabel : period==='week' ? r=>r._weekLabel : r=>r._monthLabel;
  const map = new Map();
  RECORDS.forEach(r=>{
    const k = keyFn(r);
    if(!map.has(k)) map.set(k, {key:k, label:labelFn(r), items:[]});
    map.get(k).items.push(r);
  });
  return Array.from(map.values()).sort((a,b)=> a.key<b.key?-1:1);
}

function pctChange(cur, prev){
  if(prev===0) return cur===0? 0 : null;
  return ((cur-prev)/prev)*100;
}

    <div><b>${cur.label}</b> 기준 총 <b>${total}건</b> 인입${totalDeltaTxt ? ' ('+totalDeltaTxt+')':''}</div>
    <div>총 처리비용 합계 <b>${fmtWon(totalCost)}</b> (재출고 ${restock.cnt}건 · 환불 ${refund.cnt}건 · 현금 처리 건수 ${claim.cnt}건)</div>
    <div>자주 들어오는 문의: <b>${kwText}</b></div>
  `;
}

document.getElementById('periodSeg').addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  document.querySelectorAll('#periodSeg button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  state.period = btn.dataset.p;
  state.selKey = null;
  populateSelect();
  render();
});
document.getElementById('periodSelect').addEventListener('change', e=>{
  state.selKey = e.target.value;
  render();
});

populateSelect();
render();
</script>
</body>
</html>
